    description:
      ru: "Один из авторов Huly Platform, открытый фреймворк для бизнес-приложений: чат, управление проектами, CRM, HRM и ATS."
      en: "Built Huly Platform, an open framework for business applications: Chat, Project Management, CRM, HRM, and ATS."
    bullets:
      - ru: Разработал Tracker, GitHub Integration, системные компоненты и компоненты интерфейса; продукты на платформе создавали несколько команд, включая Huly и TraceX.
        en: Built the Tracker, GitHub Integration, and system and UI components used by several product teams, including Huly and TraceX.
      - ru: Определял продуктовые решения и отвечал за продукт, управлял промышленной эксплуатацией Kubernetes и надежностью сервисов (SRE), поддерживал 2 000 ежедневных пользователей.
