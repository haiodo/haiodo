profile:
  name:
    ru: Андрей Соболев
    en: Andrey Sobolev
  title:
    ru: Инженер-разработчик / Архитектор / Сооснователь
    en: Software Engineer / Software Architect / Co-Founder
  location:
    ru: Россия
    en: Russia
  summary:
    ru: >-
      Более 20 лет в разработке программного обеспечения: архитектура распределенных систем,
      бизнес-платформ, интегрированных сред разработки (IDE) и инструментов разработчика.
      Опыт VP и CTO в Xored Software: технологическая стратегия, руководство клиентскими
      направлениями Cisco, Spirent и InterSystems (около 30 инженеров в Cisco-направлении),
      планирование релизов и состава команд, работа с заказчиками. Промышленная эксплуатация
      Kubernetes и обеспечение надежности (SRE). Разработка на TypeScript, Go, Java, C++ и Swift.
    en: >-
      Software Engineer and Architect with 20+ years of experience in distributed systems,
      business platforms, IDEs, and developer tools. Served as VP and CTO at Xored Software:
      technology strategy, leadership of the Cisco, Spirent, and InterSystems client directions
      (~30 engineers in the Cisco roster), release and staffing planning, and customer-facing
      work. Production Kubernetes and SRE. Hands-on development in TypeScript, Go, Java, C++,
      and Swift.

contacts:
