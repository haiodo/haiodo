experience:
  - id: intabia
    organization:
      ru: Intabia Fusion
      en: Intabia Fusion
    role:
      ru: Сооснователь
      en: Co-Founder
    period:
      ru: Октябрь 2025 - настоящее время
      en: October 2025 - Present
      blog: "2025 -"
    description:
      ru: "Развиваю Интабия Платформу, открытое рабочее место для команд: Chat, Tracker, Office, Drive; Web, Desktop, iOS, Android и MCP."
      en: "Develop Intabia Platform, an open team workspace: Chat, Tracker, Office, and Drive across Web, Desktop, iOS, Android, and MCP."
    bullets:
      - ru: Определяю продуктовую стратегию и отвечаю за продукт, управляю промышленной эксплуатацией Kubernetes и надежностью сервисов (SRE), решаю инциденты пользователей.
        en: Define product strategy and own product delivery, manage production Kubernetes and SRE, and resolve user incidents.
      - ru: Разрабатываю Helm-чарты и сложную функциональность, администрирую PostgreSQL, оптимизирую производительность.
        en: Develop Helm charts and complex features, administer PostgreSQL, and optimize performance.
