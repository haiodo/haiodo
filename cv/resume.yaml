profile:
  name:
    ru: Андрей Соболев
    en: Andrey Sobolev
  title:
    ru: Инженер-разработчик / Архитектор / Сооснователь
    en: Software Engineer / Software Architect / Co-Founder
  location:
    ru: Россия
    en: Russia
  summary:
    ru: >-
      Более 20 лет в разработке программного обеспечения: архитектура распределенных систем,
      бизнес-платформ, интегрированных сред разработки (IDE) и инструментов разработчика.
      Ответственность за продукт, техническое руководство командами, промышленная эксплуатация
      Kubernetes и обеспечение надежности (SRE). Разработка на TypeScript, Go, Java, C++ и Swift.
    en: >-
      Software Engineer and Architect with 20+ years of experience in distributed systems,
      business platforms, IDEs, and developer tools. Product ownership, engineering leadership,
      production Kubernetes, and SRE. Hands-on development in TypeScript, Go, Java, C++, and Swift.

