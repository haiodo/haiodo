    blogDetail: Product ownership, Kubernetes в проде, SRE и поддержка пользователей; Helm, PostgreSQL, оптимизация производительности; Svelte, Node.js, Go, Swift; продолжение Huly.io; управление роботами на ROS с Go, Java и React, март-октябрь 2026

