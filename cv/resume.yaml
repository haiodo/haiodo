    blogRoleEn: Co-Founder, Intabia Platform
    blogDetail: Product ownership, Kubernetes в проде, SRE и поддержка пользователей; Helm, PostgreSQL, оптимизация производительности; Svelte, Node.js, Go, Swift; продолжение Huly.io; управление роботами на ROS с Go, Java и React, март-октябрь 2026
    blogDetailEn: Product ownership, production Kubernetes, SRE and user support; Helm, PostgreSQL, performance tuning; Svelte, Node.js, Go, Swift; the successor to Huly.io; robot control on ROS with Go, Java and React, March-October 2026

