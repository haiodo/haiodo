            en: Developed Q7 for Eclipse/SWT UI test automation; optimized the record/replay runtime to pass 1,500+ customer test cases.
          - ru: Разработал Q7 Server с архитектурой клиент/сервер/агент и удаленными вызовами ECL (RPC); развивал командный язык ECL и среду выполнения отладчика.
