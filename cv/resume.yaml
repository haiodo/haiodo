skills:
  ru: |-
    Управление: техническое руководство несколькими командами и направлениями, архитектура продуктовых линеек, планирование релизов и состава команд, ротация и замена инженеров, отбор и наём кандидатов, согласование headcount с заказчиком, Scrum/Kanban, scrum of scrums, code review, CI/CD.
    Management plane: инвентаризация устройств, модели и сенсоры, телеметрия, SNMP-ловушки, out-of-band-доступ (serial/Telnet/SSH), northbound API.
    Языки: TypeScript, JavaScript, Node.js, Go, Java, C++, Swift, Kotlin, Python.
    Веб: Svelte, React.
    ОС: RHEL 6+, Gentoo (5+ лет), FreeBSD, OpenBSD, Windows 95/NT/2000/..., macOS (15+ лет).
    Платформы: Kubernetes, Helm, Docker, PostgreSQL, MongoDB, gRPC, ROS/ROS2.
    Сети и протоколы: NETCONF, YANG, SNMP/MIB, SSH, Telnet/serial, REST, protobuf, TCP/UDP, VPP, SR-IOV, OVS, WireGuard, netlink/netns.
    Инструменты: Git, Maven/Tycho, Jenkins, GitHub Actions, Eclipse RCP/EMF/GEF, JUnit.
    Домены: management plane, IDE и инструменты разработчика, распределённые системы, SRE, embedded-инструменты, робототехника.
  en: |-
    Management: technical leadership of several teams and directions, product-line architecture, release and staffing planning, engineer rotation and replacement, candidate screening and hiring, headcount negotiation with customers, Scrum/Kanban, scrum of scrums, code review, CI/CD.
    Management plane: device inventory, models and sensors, telemetry, SNMP traps, out-of-band access (serial/Telnet/SSH), northbound API.
    Languages: TypeScript, JavaScript, Node.js, Go, Java, C++, Swift, Kotlin, Python.
    Web: Svelte, React.
    Operating Systems: RHEL 6+, Gentoo (5+ years), FreeBSD, OpenBSD, Windows 95/NT/2000/..., macOS (15+ years).
    Platforms: Kubernetes, Helm, Docker, PostgreSQL, MongoDB, gRPC, ROS/ROS2.
    Networking: NETCONF, YANG, SNMP/MIB, SSH, Telnet/serial, REST, protobuf, TCP/UDP, VPP, SR-IOV, OVS, WireGuard, netlink/netns.
    Tools: Git, Maven/Tycho, Jenkins, GitHub Actions, Eclipse RCP/EMF/GEF, JUnit.
    Domains: management plane, IDEs and developer tools, distributed systems, SRE, embedded tooling, robotics.

