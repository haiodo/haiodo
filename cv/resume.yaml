          - ru: "Руководил командами на проектах Cisco и Spirent: планировал релизы и состав команд, проводил замены и ротацию инженеров, согласовывал headcount и сроки с заказчиком; спланировал ротацию скрам-мастеров для 5 команд и scrum of scrums."
